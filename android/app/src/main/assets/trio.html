<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LOCUS Trio</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--fg:#14202b;--muted:#55646f;--line:#d5dce2;--good:#0f8a5f;--warn:#b7791f;--bad:#c2412d;--accent:#22c3e6}
@media (prefers-color-scheme:dark){:root{--bg:#0d1318;--card:#151d24;--fg:#e6edf2;--muted:#93a3ae;--line:#26323b;--good:#3ccf97;--warn:#e0a84a;--bad:#ef7a65}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,Segoe UI,sans-serif;padding:20px max(16px,env(safe-area-inset-left))}
.wrap{max-width:860px;margin:0 auto}h1{font-size:1.7rem;margin:0 0 4px}p{margin:0 0 10px;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-top:14px}
canvas{width:100%;height:auto;display:block;aspect-ratio:16/10}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}th,td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--line)}th{font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}tr:last-child td{border-bottom:0}
.ok{color:var(--good)}.warn{color:var(--warn)}.bad{color:var(--bad)}
.scroll{overflow-x:auto}
</style></head><body><div class="wrap">
<h1>LOCUS Trio</h1>
<p id="sub">Connecting…</p>
<div class="card"><canvas id="c" width="800" height="500"></canvas></div>
<div class="card scroll"><table><thead><tr><th>Link</th><th>Hears / heard by</th><th>Average</th><th>Distance</th><th>Check</th></tr></thead><tbody id="rows"></tbody></table></div>
<p style="margin-top:12px" id="foot"></p>
</div>
<script>
const L='ABCDEF';
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
function fmt(v,u,d){return v==null?'–':v.toFixed(d||0)+(u||'')}
function draw(s){
  const W=cv.width,H=cv.height;ctx.clearRect(0,0,W,H);ctx.font='600 22px system-ui';ctx.textAlign='center';
  if(!s.layout){ctx.fillStyle=css('--muted');ctx.fillText('Waiting for enough links…',W/2,H/2);return}
  const P=s.layout.pts,xs=P.map(p=>p[0]),ys=P.map(p=>p[1]),n=s.n;
  const minX=Math.min(...xs),maxX=Math.max(...xs),minY=Math.min(...ys),maxY=Math.max(...ys);
  const k=Math.min((W-220)/Math.max(.5,maxX-minX),(H-190)/Math.max(.5,maxY-minY));
  const ox=W/2-k*(minX+maxX)/2,oy=H/2+k*(minY+maxY)/2;
  const X=P.map(p=>ox+k*p[0]),Y=P.map(p=>oy-k*p[1]);
  const cx=X.reduce((a,b)=>a+b)/n,cy=Y.reduce((a,b)=>a+b)/n;
  s.links.forEach(l=>{
    if(l.d==null)return;
    const q=(l.ab!=null)+(l.ba!=null),off=l.trust!=null&&l.trust<0.8;
    ctx.lineWidth=q==2?5:3;ctx.strokeStyle=off?css('--bad'):q==2?css('--good'):css('--warn');ctx.setLineDash(off?[12,9]:[]);
    ctx.beginPath();ctx.moveTo(X[l.a],Y[l.a]);ctx.lineTo(X[l.b],Y[l.b]);ctx.stroke();ctx.setLineDash([]);
    if(n<=4||off){const mx=(X[l.a]+X[l.b])/2,my=(Y[l.a]+Y[l.b])/2,vx=mx-cx,vy=my-cy,m=Math.hypot(vx,vy)||1;
      ctx.fillStyle=off?css('--bad'):css('--fg');ctx.fillText(fmt(l.d,' m',1),mx+vx/m*42,my+vy/m*42+8)}
  });
  for(let i=0;i<n;i++){ctx.beginPath();ctx.arc(X[i],Y[i],26,0,7);ctx.fillStyle=i==s.me?css('--fg'):s.heard[i]?css('--accent'):css('--muted');ctx.fill();ctx.fillStyle=i==s.me?css('--bg'):'#06242c';ctx.fillText(L[i],X[i],Y[i]+8)}
  ctx.font='16px system-ui';ctx.fillStyle=css('--muted');ctx.textAlign='left';
  ctx.fillText('Shape only (the mirror image is equally possible). Typical disagreement '+s.layout.rms.toFixed(1)+' m over '+s.layout.links+' links.',14,H-14);
}
function rows(s){
  document.getElementById('rows').innerHTML=s.links.map(l=>{
    let chk;
    if(l.trust!=null&&l.trust<0.8)chk='<span class="bad">disagrees with the rest ('+fmt(l.resid,' m',1)+')</span>';
    else if(l.agree==null)chk='<span class="warn">one direction only</span>';
    else chk=l.agree<=4?'<span class="ok">both agree ('+l.agree+' dB)</span>':'<span class="warn">directions differ by '+l.agree+' dB</span>';
    return `<tr><td>${L[l.a]}–${L[l.b]}</td><td>${fmt(l.ab,' dBm')} / ${fmt(l.ba,' dBm')}</td><td>${fmt(l.rssi,' dBm',1)}</td><td>${fmt(l.d,' m',2)}</td><td>${chk}</td></tr>`}).join('');
}
async function tick(){
  try{const s=await (await fetch('/api/state',{cache:'no-store'})).json();
    document.getElementById('sub').textContent='Seen from device '+L[s.me]+' ('+s.device+'), mesh of '+s.n+'. 1 m reading '+s.rssi1m+' dBm, path-loss exponent '+s.pathLoss+'.';
    draw(s);rows(s);document.getElementById('foot').textContent='Every device advertises and scans at the same time and shares its readings inside its advertisement, so all devices show the same layout.';
  }catch(e){document.getElementById('sub').textContent='Cannot reach the device. Same Wi-Fi? App still running?'}
  setTimeout(tick,700);
}
tick();
</script></body></html>
